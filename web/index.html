<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>금융 통합 비서</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>금융 통합 비서</h1>
      <p class="brand-sub">금융감독원 공시 · 정책금융 공공데이터 기반 상품 비교</p>
    </div>
    <button id="new-chat" type="button" class="ghost">새 대화</button>
  </header>

  <main id="messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="대화 내용"></main>

  <button id="scroll-bottom" type="button" hidden>새 답변 ↓</button>

  <footer>
    <form id="chat-form" autocomplete="off">
      <input id="chat-input" type="text" placeholder="예금·적금·대출에 대해 물어보세요" aria-label="메시지 입력" />
      <button id="send" type="submit">전송</button>
    </form>
    <p class="legal">
      가입 권유나 투자 자문이 아닌 비교 정보예요. · 로그인 없이 이용하며 개인정보를 수집하지 않아요.
    </p>
  </footer>

  <!-- 웰컴 화면. "새 대화"를 누르면 이 템플릿을 그대로 다시 그린다. -->
  <template id="welcome-tpl">
    <section class="welcome">
      <h2>무엇을 도와드릴까요?</h2>
      <p class="welcome-lead">
        금융감독원 공시와 공공데이터를 실시간으로 조회해 조건에 맞는 상품을 비교해드려요.
      </p>

      <!-- 상품 건수는 README.md의 데이터 소스 설명이 기준이다. 색인 범위를 넓히면 같이 고칠 것. -->
      <ul class="cards">
        <li>
          <span class="card-tag">금리 비교</span>
          <p>정기예금·적금·주택담보대출·전세자금대출·개인신용대출 <b>1,042개</b> 상품을 금리순으로</p>
        </li>
        <li>
          <span class="card-tag">정책금융상품</span>
          <p>햇살론·디딤돌·버팀목 등 정책대출 <b>325종</b>과 청년미래적금 등 자산형성 지원 <b>559종</b></p>
        </li>
        <li>
          <span class="card-tag">조건 검색</span>
          <p>“급여이체 우대”, “중도상환수수료 없는”처럼 문장으로 설명한 조건도 찾아드려요</p>
        </li>
        <li>
          <span class="card-tag">용어·제도 설명</span>
          <p>복리, 중도상환수수료, 예금자보호 같은 금융 용어와 제도를 풀어드려요</p>
        </li>
      </ul>

      <p class="chips-label">이렇게 물어보세요</p>
      <div class="chips">
        <button class="chip" type="button">1년 정기예금 금리 높은 순으로 알려줘</button>
        <button class="chip" type="button">급여이체 우대 있는 적금 찾아줘</button>
        <button class="chip" type="button">무주택 청년이 받을 수 있는 전세자금대출 알려줘</button>
        <button class="chip" type="button">청년이 가입할 수 있는 정책 적금 뭐가 있어?</button>
        <button class="chip" type="button">중도상환수수료가 뭐야?</button>
      </div>

      <p class="scope">
        금융상품 비교와 금융 용어·제도 설명만 도와드려요.
        주식·펀드·보험 상품 추천이나 금융과 무관한 주제는 정중히 거절해요.
      </p>
    </section>
  </template>

  <script src="/app.js"></script>
</body>
</html>
